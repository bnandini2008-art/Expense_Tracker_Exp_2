<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly ♡ — Track • Save • Grow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'><path d='M21 18v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1h-9a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h9zm-9-2h10V8H12v8zm4-3a1 1 0 1 1 0-2 1 1 0 0 1 0 2z'/></svg>">
  
  <!-- Google Fonts: Plus Jakarta Sans & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Nunito', 'sans-serif'],
          },
          colors: {
            spendly: {
              blue: '#3E7BFA',
              dark: '#1A365D',
              lightBlue: '#E8F2FD',
              card: '#FFFFFF',
              coral: '#F87171',
              mint: '#34D399',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (runs JSX natively in browser without npm build) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- jsPDF & AutoTable for PDF report generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-[#EDF5FE] via-[#E4EFFD] to-[#D8E8FC] min-h-screen text-[#1E3A67] selection:bg-blue-200">
  <!-- Subtle Background Floating Cloud / Hearts Accents -->
  <div class="fixed top-6 left-1/3 pointer-events-none select-none text-blue-200 text-3xl opacity-40 floating-heart">♡</div>
  <div class="fixed bottom-12 right-20 pointer-events-none select-none text-blue-300 text-4xl opacity-30 floating-heart" style="animation-delay: 2s;">♡</div>
  <div class="fixed top-24 right-1/4 pointer-events-none select-none text-sky-200 text-2xl opacity-50 floating-heart" style="animation-delay: 1s;">✦</div>

  <!-- Root React Mount Node -->
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
